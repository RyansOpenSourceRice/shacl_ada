name: Feature proposal
description: Propose a capability addition; check MAINTAINERS.md scope and ROADMAP.md non-goals first.
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need does this address, and who hits it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Include what it would intentionally not do.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: MAINTAINERS.md defines what shacl_ada does and does not do.
      options:
        - label: This proposal is within the documented scope of the project
          required: true

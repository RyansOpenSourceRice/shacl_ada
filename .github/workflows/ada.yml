name: ada

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ada-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-prove-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: alire-project/setup-alire@v4
        with:
          version: "2.1.1"

      - name: Add the flyology Alire index
        run: alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology

      - name: Build the library
        run: alr --non-interactive build

      - name: Install gnatprove (pinned FSF build)
        run: |
          curl -fsSL -o /tmp/gnatprove.tar.gz \
            https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatprove-16.1.0-1/gnatprove-x86_64-linux-16.1.0-1.tar.gz
          echo "82528bef29857e239373fcc36732837d743f5a00805d502c70455422ffc97191  /tmp/gnatprove.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/opt"
          tar -xzf /tmp/gnatprove.tar.gz -C "$HOME/.local/opt"
          echo "$HOME/.local/opt/gnatprove-x86_64-linux-16.1.0-1/bin" >> "$GITHUB_PATH"

      - name: Prove the SPARK core
        #  Two-phase proof: the full run carries two large postconditions
        #  (Check_Property, Check_Kind — declared at shacl_ada-eval.ads:200
        #  and :222) whose in-context proof is context-explosion-bound.
        #  They are re-proven standalone with --limit-subp, the
        #  gnatprove-documented workflow for such cases. Failed checks
        #  print to stderr, never to the redirected logs; the summary
        #  file is the authority, snapshotted per run. Phase 1 tolerates
        #  unproved checks only inside those two instantiated units;
        #  anything else fails. Phase 2 must be fully clean.
        run: |
          mkdir -p proof/obj
          gnatprove -P proof/spark_core.gpr -U --level=3 --timeout=300 -j2 \
            > proof/obj/proof-phase1.log
          cp proof/obj/gnatprove/gnatprove.out proof/obj/summary-phase1.out
          gnatprove -P proof/spark_core.gpr -U --level=3 --timeout=300 \
            --limit-subp=shacl_ada-eval.ads:200 \
            --limit-subp=shacl_ada-eval.ads:222 \
            > proof/obj/proof-phase2.log
          if grep "not proved," proof/obj/summary-phase1.out \
               | grep -vE "Proof_Eval\.Check_(Property|Kind) at shacl_ada-eval\.ads:"
          then
            echo "SPARK phase 1: unproved checks outside the declared marginal units" >&2
            exit 1
          fi
          if grep "not proved," proof/obj/gnatprove/gnatprove.out; then
            echo "SPARK phase 2: limit-subp proof incomplete" >&2
            exit 1
          fi

      - name: Build and run the tests
        run: |
          cd tests
          alr --non-interactive build
          alr --non-interactive exec -- bin/shapes_tests
          alr --non-interactive exec -- bin/conformance \
            ../corpora/data-shapes-test-suite/tests/core/complex/personexample.ttl \
            ../corpora/data-shapes-test-suite/tests/core/complex/personexample.ttl
          ulimit -s 65536
          alr --non-interactive exec -- bin/eval_tests \
            ../corpora/data-shapes-test-suite/tests/core

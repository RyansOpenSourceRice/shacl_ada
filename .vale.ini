# Vale configuration for prose style checks on markdown docs.
# Self-contained: the style lives in styles/Template/ (no package download).
# Spelling is handled by cspell (see .pre-commit-config.yaml); Vale covers
# grammar-style rules: banned AI-slop/promotional phrasing, heading case,
# and repeated words. Extend styles/Template/ per project as needed.

StylesPath = styles
MinAlertLevel = suggestion

# Upstream-copied content (the pointer skill, .agents/) is excluded at the
# pre-commit hook level (`exclude:`) — keep it byte-identical to its source
# (preferences.md §27).

[*.{md,markdown}]
BasedOnStyles = Template
